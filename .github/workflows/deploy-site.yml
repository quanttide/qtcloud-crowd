# 部署 site：推送 site/* tag 时，构建 React+Vite 介绍页上传 OSS，刷新 CDN。
#
# 架构：site/* tag → Actions（npm build + ossutil cp）
#   → OSS 桶（qtcloud-crowd-site 静态网站模式）→ CDN（crowd.cloud.quanttide.com）
#
# 基础设施（OSS 桶 + CDN）由 manifests/terraform 管理（本工作流只构建 + 上传 + 刷新，
# 不跑 terraform，与 qtcloud-execute deploy-site.yml 一致）。
#
# 所需 GitHub secrets（org 级，已有）：
#   - ALIYUN_ACCESS_KEY_ID / ALIYUN_ACCESS_KEY_SECRET：RAM 用户 AccessKey（OSS 上传 + CDN 刷新）

name: Deploy Site to OSS

on:
  push:
    tags:
      - 'site/*'

concurrency:
  group: deploy-site
  cancel-in-progress: false

env:
  OSS_BUCKET: qtcloud-crowd-site
  OSS_ENDPOINT: oss-cn-hangzhou.aliyuncs.com
  CDN_DOMAIN: crowd.cloud.quanttide.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site
        working-directory: src/site
        run: |
          npm ci
          npm run build

      - uses: manyuanrong/setup-ossutil@v3.0
        with:
          endpoint: ${{ env.OSS_ENDPOINT }}
          access-key-id: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}

      # 缓存策略分离（Vite SPA 部署要点）：
      # - 产物（assets/* 哈希文件）可长缓存：文件名带内容哈希，内容变则文件名变
      # - 入口文件（index.html）必须 no-cache：否则浏览器与 CDN 缓存旧 HTML，
      #   永远引用旧 assets，发布后用户看不到更新
      - name: Upload to OSS（产物长缓存）
        run: ossutil cp src/site/dist/ oss://${{ env.OSS_BUCKET }}/ -r -f --meta=Cache-Control:public,max-age=31536000

      - name: Upload to OSS（入口文件 no-cache）
        run: |
          for f in index.html; do
            ossutil cp "src/site/dist/$f" "oss://${{ env.OSS_BUCKET }}/$f" -f --meta=Cache-Control:no-cache
          done

      - name: Refresh CDN
        run: |
          pip install aliyun-python-sdk-cdn
          python -c "
          from aliyunsdkcore.client import AcsClient
          from aliyunsdkcdn.request.v20180510.RefreshObjectCachesRequest import RefreshObjectCachesRequest
          import os
          cli = AcsClient(os.environ['ALIYUN_ACCESS_KEY_ID'], os.environ['ALIYUN_ACCESS_KEY_SECRET'], 'cn-hangzhou')
          req = RefreshObjectCachesRequest()
          req.set_ObjectPath('https://${{ env.CDN_DOMAIN }}/')
          req.set_ObjectType('Directory')
          cli.do_action_with_exception(req)
          "
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
